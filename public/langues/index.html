<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langues — MyDidactik Stories</title>
<meta name="description" content="Simulateur vocal : réserver une table dans la langue du restaurant.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;700;800;900&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/demo.css">
<!--ANALYTICS-->
</head>
<body>
<div id="app"></div>
<script>
var LANGS = {
  en: { nom: "English", lang: "anglais", resto: "The Copper Fig · Londres", perso: "Emma" },
  nl: { nom: "Nederlands", lang: "néerlandais (flamand)", resto: "De Zwarte Zwaan · Gand", perso: "Wout" },
  es: { nom: "Español", lang: "espagnol", resto: "La Higuera · Mexico", perso: "Carlos" },
  de: { nom: "Deutsch", lang: "allemand", resto: "Zum Goldenen Hirsch · Munich", perso: "Lukas" }
};
var NIVEAUX = {
  debutant: { txt: "débutant (A1-A2) : phrases très courtes et simples, débit lent, vocabulaire de base ; répète volontiers, reformule, propose des choix (a ou b) pour aider.", label: "débutant (A1-A2)" },
  inter: { txt: "intermédiaire (B1-B2) : phrases simples, débit normal, vocabulaire courant.", label: "intermédiaire (B1-B2)" },
  avance: { txt: "avancé (C1+) : débit naturel, vocabulaire riche, expressions idiomatiques, rythme de quelqu'un de pressé.", label: "avancé (C1+)" }
};
window.DEMO = {
  key: "langues", titleText: "Langues",
  accent: { accent: "#ff6b4a", soft: "#ffe3dc", on: "#3b1006" },
  tag: "Langues · jeu de rôle",
  title: "Réserver une table <em>dans la langue du restaurant</em>",
  lead: "Tu appelles un restaurant. Ton interlocuteur ne parle que sa langue, mais il est patient. Pas de traduction, pas de filet : comme en vrai.",
  mission: {
    titre: "Ta mission",
    paras: ["Tu veux réserver une table pour ce week-end. Choisis la langue et ton niveau : l'interlocuteur s'adapte."],
    faits: [
      "Donne la date, l'heure et le nombre de personnes.",
      "Indique un nom, une préférence (terrasse ou intérieur) et d'éventuelles allergies.",
      "Si l'heure demandée est complète, négocie un autre créneau.",
      "Tu bloques sur un mot ? Reformule ou demande de répéter : c'est ce qu'on fait au téléphone."
    ]
  },
  picker: { label: "Choisis la langue", row: true, items: [
    { id: "en", nom: "English", sous: "Londres", role: "The Copper Fig · Londres", ico: "EN" },
    { id: "nl", nom: "Nederlands", sous: "Gand", role: "De Zwarte Zwaan · Gand", ico: "NL" },
    { id: "es", nom: "Español", sous: "Mexico", role: "La Higuera · Mexico", ico: "ES" },
    { id: "de", nom: "Deutsch", sous: "Munich", role: "Zum Goldenen Hirsch · Munich", ico: "DE" }
  ] },
  extras: [ { id: "niveau", label: "Ton niveau", row: true, items: [
    { id: "debutant", nom: "Débutant", sous: "A1 – A2", ico: "1" },
    { id: "inter", nom: "Intermédiaire", sous: "B1 – B2", ico: "2" },
    { id: "avance", nom: "Avancé", sous: "C1 et plus", ico: "3" }
  ] } ],
  vars: function (state) { return { niveau_consigne: NIVEAUX[state.extra.niveau].txt }; },
  maxMin: 4,
  liveHint: "Parle uniquement dans la langue choisie. Tu peux raccrocher avec le bouton rouge.",
  motifs: { accord: "Table réservée", refus: "Pas de réservation", fin: "Fin de l'appel", troll: "Appel coupé", timeout: "Temps écoulé", abandon: "Tu as raccroché" },
  issues: { gagne: "Réservation obtenue", moyen: "Presque", perdu: "À retravailler" },
  cleTitre: "Formules à réutiliser",
  debrief: function (c) {
    var L = LANGS[c.state.pick], N = NIVEAUX[c.state.extra.niveau];
    return "Tu es professeur de " + L.lang + ", exigeant sur la justesse mais toujours encourageant. Voici la transcription automatique d'un appel téléphonique simulé : l'apprenant (francophone) réserve une table au restaurant " + L.resto + ". Son niveau annoncé : " + N.label + ".\n\n" +
    "TRANSCRIPTION (APPRENANT = l'élève ; INTERLOCUTEUR = " + L.perso + ", le restaurant) :\n" + c.transcript + "\n\n" +
    "Fin de l'appel (motif technique) : " + c.motif + "\n\n" +
    "AVERTISSEMENT : transcription vocale automatique, donc imparfaite. Ne corrige jamais ce qui pourrait n'être qu'un mot mal reconnu ; ne corrige que ce qui est clairement faux ou maladroit. Ne juge pas l'accent.\n\n" +
    "Rédige tout le débrief EN FRANÇAIS (les citations restent dans la langue cible). Retourne UNIQUEMENT un objet JSON, sans texte autour :\n" +
    '{"issue":"gagne"|"moyen"|"perdu","titre":"4 à 7 mots encourageants","resume":"2 phrases : la réservation a-t-elle abouti et comment l\'élève s\'est débrouillé, en tutoyant, sans accord genré","forts":["ce qui était bien (vocabulaire, politesse, réactivité), avec un exemple cité"],"faibles":["ce qui a coincé (blocage, hésitation, malentendu), avec le moment"],"corrections":[{"dit":"phrase ou mot de l\'élève, tel que transcrit","mieux":"la formulation correcte et naturelle dans la langue cible","pourquoi":"explication courte en français"}],"cle":"2 ou 3 formules utiles à réutiliser au téléphone, dans la langue cible, avec leur traduction française entre parenthèses","aRetenir":"une seule phrase : la priorité pour progresser"}\n\n' +
    'RÈGLES : "gagne" si la table est réservée (date, heure, nombre de personnes, nom obtenus) ; "moyen" si l\'essentiel est passé avec de l\'aide ; "perdu" sinon. Maximum 5 corrections, les plus utiles. Adapte l\'exigence au niveau annoncé. Si la transcription est trop courte, dis-le dans resume, mets perdu et renvoie des tableaux vides.';
  }
};
</script>
<script src="/assets/el-demo.js"></script>
<script src="/assets/demo.js"></script>
</body>
</html>
